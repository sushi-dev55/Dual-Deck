[package]
name = "dual-deck"
version = "0.1.0"
description = "Turn a DualSense controller into a desktop action deck"
authors = ["sushi-dev55", "Dual Deck contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/sushi-dev55/Dual-Deck"
rust-version = "1.85"
default-run = "dual-deck"

[lib]
name = "dual_deck_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
parking_lot = "0.12.5"
rusqlite = { version = "0.40.1", features = ["bundled", "chrono", "uuid"] }
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls"] }
sdl3 = { version = "0.18.4", features = ["hidapi"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5.7"
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }

[dev-dependencies]
tempfile = "3.24.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
